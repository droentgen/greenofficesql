name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # InfinityFree (and most free/shared hosts) sandbox PHP's open_basedir to the
      # htdocs/ folder only — nothing outside it is reachable, even via a sibling
      # folder on the same FTP account. So the WHOLE project (public/, app/,
      # config/, database/) goes inside htdocs/ together, and the root .htaccess
      # (see .htaccess) routes requests into public/ and blocks direct access to
      # app/, config/, database/.
      - name: Deploy whole project → htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./greenoffice.freedev.app/htdocs/
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/.vscode/**
            **/public/uploads/**
            **/config/config.php
            **/Dockerfile*
            **/docker-entrypoint*.sh
            **/docker-apache.conf
            **/docker-php-uploads.ini
            **/Caddyfile
            **/vercel.json
            **/.vercelignore
            **/.dockerignore
            **/README.md
            **/CLAUDE.md
            **/note*.txt
            **/EX-เอกสาร/**
